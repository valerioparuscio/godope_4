name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The real production site (www.dope-game.it) lives in a separate repo
  # (valerioparuscio/dope) that embeds this game in an iframe at /game/ —
  # that folder used to be a hand-copied snapshot of frontend/dist, which
  # is why it kept going stale (2026-08-23). This job rebuilds the same
  # frontend and pushes it straight into that repo's game/ folder on every
  # change, so dope-game.it always reflects the latest push here.
  publish-to-dope-site:
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist/ into valerioparuscio/dope's game/ folder
        env:
          DOPE_SITE_TOKEN: ${{ secrets.DOPE_SITE_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${DOPE_SITE_TOKEN}@github.com/valerioparuscio/dope.git" ../dope-site
          rm -rf ../dope-site/game
          mkdir -p ../dope-site/game
          cp -r dist/* ../dope-site/game/
          cd ../dope-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update game/ from godope_4@${GITHUB_SHA}"
            git push
          fi