<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: full-screen on notched phones; the CSS keeps clear of the notch with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <!-- Installed as an app (the manifest is added by vite-plugin-pwa). iOS needs its own tags. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DOPE" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>DOPE</title>
    <script>
      // The layout needs about 780 CSS px of height. A phone held sideways has far less (about 360-430), so the
      // page used to be squeezed and scrolled. Here the viewport is made wider instead, which makes the browser
      // show the whole page zoomed out, in proportion. Tablets and computers are left alone (not touch screens
      // of that size / not "coarse" pointers).
      (function () {
        var MIN_HEIGHT = 780;
        var meta = document.querySelector('meta[name="viewport"]');
        var normal = meta.getAttribute('content');
        function fit() {
          var content = normal;
          var zoomed = false;
          if (matchMedia('(pointer: coarse)').matches && matchMedia('(orientation: landscape)').matches) {
            var long = Math.max(screen.width, screen.height);
            var short = Math.min(screen.width, screen.height);
            if (short < MIN_HEIGHT) {
              content = 'width=' + Math.round((long * MIN_HEIGHT) / short) + ', viewport-fit=cover';
              zoomed = true;
            }
          }
          if (meta.getAttribute('content') !== content) meta.setAttribute('content', content);
          // The CSS can tell the zoomed-out phone layout apart (see ".phone-zoom" in responsive.css).
          document.documentElement.classList.toggle('phone-zoom', zoomed);
        }
        fit();
        addEventListener('orientationchange', fit);
        addEventListener('resize', fit);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
